[workspace]
resolver = "3"
members = ["crates/ldn", "crates/ldn-daemon", "crates/wingui", "crates/ldnd"]

[workspace.dependencies]
ldn = { path = "./crates/ldn" }
anyhow = { version = "1.0.104", features = ["backtrace"] }
aes = "0.8.4"
ctr = "0.9.2"
aes-gcm = "0.10.3"
sha2 = "0.10.9"
hmac = "0.12.1"
getrandom = "0.4.3"

[profile.release]
lto = true
opt-level = 2
codegen-units = 1

[workspace.lints.clippy]
manual_range_contains = "allow"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
future_not_send = "allow"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "allow"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
uninlined_format_args = "allow"
